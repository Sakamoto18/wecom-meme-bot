services:
  douyin-provider:
    build: ./services/douyin-provider
    container_name: longtu-douyin-provider
    restart: unless-stopped
    ports:
      - "127.0.0.1:9001:9001"
      - "127.0.0.1:6080:6080"
    volumes:
      - ./data/douyin-profile:/data/profile
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9001/healthz', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      astrbot-network:
        aliases: [douyin-provider]
  qq-bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: longtu-qq-bot
    command: ["npm", "run", "start:qq"]
    restart: unless-stopped
    init: true
    env_file:
      - .env.qq
    environment:
      QQ_API_HOST: 0.0.0.0
      QQ_API_PORT: 8787
      DOUYIN_PROVIDER_URL: http://douyin-provider:9001/resolve
    volumes:
      - ./memes:/app/memes:ro
      - ./config:/app/config:ro
      - ./data:/app/data
      - ./secrets:/app/secrets:ro
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      astrbot-network:
        aliases:
          - qq-bot

networks:
  astrbot-network:
    external: true
    name: ${ASTRBOT_DOCKER_NETWORK:-qqbot_astrbot_network}
